<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日快樂</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5abab;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 核心按鈕 */
        .launch-btn {
            padding: 15px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%); /* 換成粉嫩系漸層 */
            color: #4a4a4a; /* 深灰文字，搭配粉色按鈕 */
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(254, 207, 239, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            z-index: 10;
            font-family: inherit;
            letter-spacing: 2px;
        }
        .launch-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(254, 207, 239, 0.6);
        }
        .launch-btn:active {
            transform: scale(0.95);
        }

        /* 噴發照片與文字的共同樣式 */
        .burst-item {
            position: absolute;
            pointer-events: none;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0);
            animation: explode 1.6s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        /* 照片獨有樣式（手帳拍立得風） */
        img.burst-item {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border: 6px solid #fff; /* 加厚白邊像拍立得 */
            border-radius: 4px;
            box-shadow: 2px 4px 15px rgba(0,0,0,0.25);
        }

        /* 手寫文字獨有樣式 */
        span.burst-item {
            font-family: 'Klee One', sans-serif;
            font-size: 2.3rem;       /* 放大手寫字才夠看 */
            font-weight: 600;
            white-space: nowrap;
            /* 輕微的白色發光與陰影，襯托粉嫩手寫字 */
            text-shadow: 
                2px 2px 0px #fff,
                -1px -1px 0px #fff,  
                1px -1px 0px #fff,
                -1px 1px 0px #fff;
        }


        /* 噴發動畫 */
        @keyframes explode {
            0% {
                top: var(--start-y);
                left: var(--start-x);
                transform: translate(-50%, -50%) scale(0) rotate(0deg);
                opacity: 1;
            }
            50% {
                opacity: 1;
            }
            100% {
                top: calc(var(--start-y) + var(--move-y));
                left: calc(var(--start-x) + var(--move-x));
                transform: translate(-50%, -50%) scale(1.2) rotate(var(--rotate));
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <button class="launch-btn" onclick="burstEverything(event)">生日按鈕鈕鈕鈕✨</button>

    <script>
        // 照片庫
        const photoPool = [
            
            'B1.jpg',
            'B2.jpg',
            'B3.jpg',
            'B4.jpg',
            'B5.jpg',
            'B6.jpg',
            'B7.jpg'
        
        ];
        

        // 這裡輸入你想噴出來的文字內容 💬
        const textPool = ['生日快樂！', 'Happy Birthday!', '天天開心🎉', '實習順利💻', '暴富', '獲得更多樂高', '獲得更多豬豬', '跟雞排99'];

        function burstEverything(event) {
            const startX = event.clientX + 'px';
            const startY = event.clientY + 'px';
            
            // 設定照片與文字的數量
            const photoCount = 10; 
            const textCount = 8;

            // 1. 噴照片
            for (let i = 0; i < photoCount; i++) {
                const randomUrl = photoPool[Math.floor(Math.random() * photoPool.length)];
                const img = document.createElement('img');
                img.src = randomUrl;
                img.classList.add('burst-item');
                applyRandomTrajectory(img, startX, startY);
                document.body.appendChild(img);
            }

            // 2. 噴文字
            for (let i = 0; i < textCount; i++) {
                const randomText = textPool[Math.floor(Math.random() * textPool.length)];
                const span = document.createElement('span');
                span.innerText = randomText;
                span.classList.add('burst-item');
                applyRandomTrajectory(span, startX, startY);
                document.body.appendChild(span);
            }
        }

        // 計算隨機飛散軌跡的函式
        function applyRandomTrajectory(element, startX, startY) {
            const angle = Math.random() * Math.PI * 2;
            const radius = Math.random() * 250 + 150;
            const moveX = Math.cos(angle) * radius + 'px';
            const moveY = (Math.sin(angle) * radius + 100) + 'px'; // 帶點重力下墜
            const rotate = (Math.random() * 60 - 30) + 'deg'; // 文字照片轉點角度就好，別轉太暈

            element.style.setProperty('--start-x', startX);
            element.style.setProperty('--start-y', startY);
            element.style.setProperty('--move-x', moveX);
            element.style.setProperty('--move-y', moveY);
            element.style.setProperty('--rotate', rotate);
            element.style.animationDelay = (Math.random() * 0.2) + 's';

            element.addEventListener('animationend', () => {
                element.remove();
            });
        }
    </script>
</body>
</html>
