<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日快樂✨</title>
    <style>
        :root {
            --primary-color: #2795c9;
            --bubble-size: 90px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            font-family: "Microsoft JhengHei", sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        /* --- 背景照片泡泡樣式 --- */
        .bubble {
            position: absolute;
            bottom: -120px;
            width: var(--bubble-size);
            height: var(--bubble-size);
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            border: 3px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.2);
            animation: rise var(--duration) linear infinite, sway var(--sway-duration) ease-in-out infinite alternate;
            cursor: pointer;
            z-index: 1;
        }

        @keyframes rise {
            0% { transform: translateY(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-125vh); opacity: 0; }
        }

        @keyframes sway {
            0% { margin-left: -30px; }
            100% { margin-left: 30px; }
        }

        /* --- 3D 翻轉卡片樣式 --- */
        .card-container {
            width: 340px;
            height: 480px;
            cursor: pointer;
            position: relative;
            z-index: 100; /* 確保卡片在泡泡上方 */
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            border: 8px solid white;
        }

        /* 卡片正面 */
        .card-front {
            background: var(--primary-color);
            color: white;
        }

        .card-front .icon { font-size: 100px; margin-bottom: 20px; }
        .card-front h2 { font-size: 1.8rem; letter-spacing: 2px; }

        /* 卡片背面 */
        .card-back {
            background: white;
            color: #333;
            transform: rotateY(180deg);
        }

        .card-back h2 { color: var(--primary-color); margin-top: 0; }
        .card-back p { line-height: 1.8; font-size: 1.05rem; text-align: justify; }

        .hint {
            position: absolute;
            bottom: -50px;
            width: 100%;
            text-align: center;
            color: #555;
            font-weight: bold;
            text-shadow: 0 0 10px white;
        }
    </style>
</head>
<body>

    <div class="card-container" onclick="flipCard()">
        <div class="card-inner">
            <div class="card-front">
                <div class="icon">🎁</div>
                <h2>洪瑞應生日快樂</h2>
                <p>BY 你聰明可愛漂亮溫柔會聊天的學姊</p>
            </div>
            <div class="card-back">
                <h2>Happy Birthday!</h2>
                <p>TO:高高的欠揍的很E的很帥的學弟<br>
                祝你19歲生日快樂！雖然你有時候會蠢到讓我生氣 不過換句話說就是少數能牽動我情緒的人 你是很特別的存在
                跟你相處雖然有時候會有摩擦 不過整體上來說很自在 謝謝你包容我 我很開心能認識你
                總之祝你學會穿搭 找到女朋友 繼續第一名 身體健康 天天開心 中大獎
                如果有問題學姊會努力幫你的( ദ്ദി ˙ᗜ˙ )</p>
                <div style="font-size: 40px; margin-top: 10px;">🎂🍰🎉</div>
            </div>
        </div>
        <div class="hint">點卡片翻面 點泡泡戳破</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    
    <script>
        // 1. 照片設定 (請換成你自己的照片網址)
        const photoUrls = [
            'h1.png', // 這裡換成你的照片網址

            'h2.png', 'h3.png', 'h4.png', 'h5.png' , 'h6.jpg', 'h7.jpg', 'h8.jpg', 'h9.jpg'
        ];

        // 2. 卡片翻轉功能
        function flipCard() {
            document.querySelector('.card-container').classList.toggle('flipped');
            // 翻開時噴一次大彩帶
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        // 3. 泡泡產生器
        function createBubble() {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            
            const randomImg = photoUrls[Math.floor(Math.random() * photoUrls.length)];
            bubble.style.backgroundImage = `url('${randomImg}')`;

            const startPos = Math.random() * 100;
            const duration = 8 + Math.random() * 12; // 8-20秒上升
            const swayDuration = 3 + Math.random() * 4;
            const size = 70 + Math.random() * 50; // 70-120px

            bubble.style.left = startPos + 'vw';
            bubble.style.width = size + 'px';
            bubble.style.height = size + 'px';
            bubble.style.setProperty('--duration', duration + 's');
            bubble.style.setProperty('--sway-duration', swayDuration + 's');

            // 戳破泡泡效果
            bubble.onclick = (e) => {
                e.stopPropagation(); // 防止點泡泡觸發到下方的卡片
                confetti({
                    particleCount: 30,
                    scalar: 0.7,
                    origin: { x: e.clientX / window.innerWidth, y: e.clientY / window.innerHeight }
                });
                bubble.style.display = 'none';
                setTimeout(() => { bubble.remove(); createBubble(); }, 100);
            };

            document.body.appendChild(bubble);

            setTimeout(() => {
                if(bubble.parentNode) {
                    bubble.remove();
                    createBubble();
                }
            }, duration * 1000);
        }

        // 初始產生 10 個泡泡
        for(let i=0; i<10; i++) {
            setTimeout(createBubble, i * 1200);
        }
    </script>
</body>
</html>
